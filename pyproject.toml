[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ajp"
version = "0.1.0"
description = "Academic job platform: schema, connectors, ingestion"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "defusedxml>=0.7",
  "protego>=0.3",
  "pycountry>=24.6",
  "rapidfuzz>=3.6",
  # T44 (packet 027), found live by PM rebuilding the venv from scratch today: selectolax>=1.0 removed the
  # "Modest" HTML parsing backend `ajp.connectors.jobposting` imports (`from selectolax.parser import
  # HTMLParser`) in favor of a new "lexbor" backend with a different API - a genuinely clean install
  # (no old resolved wheel already on disk) crashes that module's own import with ImportError. An upper
  # bound reproduces a working environment WITHOUT any code change; migrating to lexbor's own API is a
  # real parser-behavior change needing its own identity verification, deliberately NOT done here.
  "selectolax>=0.3,<1.0",
  "pdfplumber>=0.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "reportlab>=4",
  "python-multipart>=0.0.9",
  "brotli>=1.1",
  # T22, found live (a genuinely fresh venv's own `pip install -e .`, not this session's long-lived one
  # which already happened to have it installed some other way): ajp.thesis.parser imports pypdf directly
  # for PDF text extraction - a real, always-needed hard dependency that was never actually declared here,
  # so a truly clean install crashed the whole API on startup (ajp.api.routers.thesis imports the thesis
  # pipeline unconditionally) the moment it tried to import ajp.thesis.parser.
  "pypdf>=4",
  # certifi: imported directly by ajp.connectors.base (TLS verification, D3) - already an httpx transitive
  # dependency today, so this was never actually MISSING from a real install, but declaring it directly is
  # the correct thing regardless of whether some future httpx version stops requiring it itself.
  "certifi",
  # T21: ajp-init/ajp-run/ajp-api are built around the embedded Postgres this project has used since T2 -
  # not a dev-only convenience (localhost-only RC1 has no other DB to point at), so this moved out of the
  # `dev` extra: a plain `pip install .` (T22's own clean-room bootstrap) must be able to run these scripts.
  "pgserver>=0.1.4",
]

[project.scripts]
ajp-init = "ajp.cli.init:main"
ajp-run = "ajp.cli.run:main"
ajp-api = "ajp.cli.api:main"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
# T17 similarity fingerprints: MIT-licensed, real MinHash - installs cleanly on this project's py3.9 target;
# similarity/fingerprint.py falls back to a small pure-Python MinHash if it is ever absent (packet 008's own
# instruction), so it is optional rather than a hard dependency.
similarity = ["datasketch>=1.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ajp = ["migrations/*.sql", "seeds/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real network (deselect with -m 'not live')",
    "slow: a real, end-to-end subprocess run (a fresh embedded Postgres initdb) - not network, just slower",
]
